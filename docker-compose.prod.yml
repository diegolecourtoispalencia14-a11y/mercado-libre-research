services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-research}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - research_net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - research_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: ["sh", "/app/start.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-research}
      - REDIS_URL=redis://redis:6379
      - AUTH_ENABLED=true
    ports:
      - "8000:8000"
    networks:
      - research_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: always
    ports:
      - "${PORT:-80}:80"
      - "8080:80"
    depends_on:
      - backend
    networks:
      - research_net

volumes:
  postgres_data:
  redis_data:

networks:
  research_net:
    driver: bridge
